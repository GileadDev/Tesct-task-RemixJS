services:
  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://root:example@mongo:27017/form_builder?authSource=admin
      SESSION_SECRET: 9M/IoyafeOOBOPTyPS/SinutRrJleNUNfhjcM6WLgYs=
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
